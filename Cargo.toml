[package]
name = "clkp"
version = "0.1.0"
edition = "2024"
publish = false
description = "Lookup for the volatile forum"
repository = "https://git.corbet.ch/corbet-libre/clkp.git"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"

[dependencies]
cgrd = { git = "https://git.corbet.ch/corbet-libre/cgrd.git", branch = "main", default-features = false }
cshm = { git = "https://git.corbet.ch/corbet-libre/cshm.git", branch = "main" }
serde_json = "1"
sha2 = "0.11"
data-encoding = "2"
cmmr = { git = "https://git.corbet.ch/corbet-libre/cmmr.git", branch = "main" }
cswb = { git = "https://git.corbet.ch/corbet-libre/cswb.git", branch = "main" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
cnvl = { git = "https://git.corbet.ch/corbet-libre/cnvl.git", branch = "main" }
tokio = { version = "1", features = ["rt", "macros"] }
cpfl = { git = "https://git.corbet.ch/corbet-libre/cpfl.git", branch = "main" }
cchr = { git = "https://git.corbet.ch/corbet-libre/cchr.git", branch = "main" }
ckmg = { git = "https://git.corbet.ch/corbet-libre/ckmg.git", branch = "main" }
cwst = { git = "https://git.corbet.ch/corbet-foss/cwst.git", branch = "main" }
csgn = { git = "https://git.corbet.ch/corbet-libre/csgn.git", branch = "main", default-features = false, features = ["volatile-signer"] }
cvlk = { git = "https://git.corbet.ch/corbet-foss/cvlk.git", branch = "main" }
ed25519-dalek = { version = "3", default-features = false, features = ["fast"] }
redis = { version = "1", default-features = false, features = ["tokio-comp", "script"] }
